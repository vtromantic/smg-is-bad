<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plane Bird</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    background:linear-gradient(#111,#000);
}

#score{
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    font-size:40px;
    color:white;
    font-weight:bold;
}

#credit{
    position:absolute;
    bottom:15px;
    width:100%;
    text-align:center;
    color:white;
    opacity:.7;
    font-size:18px;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    display:none;
}

#gameOver button{
    margin-top:15px;
    padding:12px 24px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}
</style>
</head>
<body>

<div id="score">0</div>

<div id="credit">
    feito por: João Vitor
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <button onclick="restartGame()">REINICIAR</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const scoreText = document.getElementById("score");
const gameOverScreen = document.getElementById("gameOver");

let gravity = 0.45;
let speed = 4;
let score = 0;
let running = true;

const plane = {
    x:120,
    y:300,
    width:60,
    height:20,
    velocity:0,
    jump:-8
};

let pipes = [];

function createPipe(){

    const gap = 220;

    const top = Math.random() * (canvas.height - 400) + 50;

    pipes.push({
        x:canvas.width,
        width:80,
        top:top,
        bottom:canvas.height - top - gap,
        passed:false
    });
}

setInterval(() => {

    if(running){
        createPipe();
    }

},1800);

function drawPlane(){

    ctx.save();

    ctx.translate(plane.x, plane.y);

    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;

    ctx.beginPath();

    // traço do avião
    ctx.moveTo(0,10);
    ctx.lineTo(40,10);

    // ponta
    ctx.lineTo(60,0);

    ctx.moveTo(40,10);
    ctx.lineTo(60,20);

    // asa
    ctx.moveTo(20,10);
    ctx.lineTo(5,0);

    ctx.moveTo(20,10);
    ctx.lineTo(5,20);

    ctx.stroke();

    ctx.restore();
}

function drawPipes(){

    ctx.fillStyle = "white";

    pipes.forEach(pipe => {

        ctx.fillRect(
            pipe.x,
            0,
            pipe.width,
            pipe.top
        );

        ctx.fillRect(
            pipe.x,
            canvas.height - pipe.bottom,
            pipe.width,
            pipe.bottom
        );
    });
}

function updatePlane(){

    plane.velocity += gravity;
    plane.y += plane.velocity;

    if(plane.y < 0){
        plane.y = 0;
    }

    if(plane.y + plane.height > canvas.height){
        endGame();
    }
}

function updatePipes(){

    pipes.forEach(pipe => {

        pipe.x -= speed;

        if(
            plane.x + plane.width > pipe.x &&
            plane.x < pipe.x + pipe.width &&
            (
                plane.y < pipe.top ||
                plane.y + plane.height > canvas.height - pipe.bottom
            )
        ){
            endGame();
        }

        if(!pipe.passed && pipe.x + pipe.width < plane.x){

            pipe.passed = true;

            score++;

            scoreText.innerText = score;
        }
    });

    pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);
}

function endGame(){

    running = false;

    gameOverScreen.style.display = "block";
}

function restartGame(){

    plane.y = 300;
    plane.velocity = 0;

    pipes = [];

    score = 0;

    scoreText.innerText = "0";

    running = true;

    gameOverScreen.style.display = "none";
}

function gameLoop(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(running){

        updatePlane();

        updatePipes();
    }

    drawPipes();

    drawPlane();

    requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", () => {

    if(running){
        plane.velocity = plane.jump;
    }
});

document.addEventListener("touchstart", () => {

    if(running){
        plane.velocity = plane.jump;
    }
});

window.addEventListener("resize", () => {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

gameLoop();
</script>

</body>
</html>
