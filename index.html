<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Plane Bird</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        overflow:hidden;
        background:#70c5ce;
        font-family:Arial, sans-serif;
    }

    canvas{
        display:block;
        margin:auto;
        background:linear-gradient(#70c5ce,#dff6ff);
    }

    #score{
        position:absolute;
        top:20px;
        width:100%;
        text-align:center;
        font-size:40px;
        color:white;
        font-weight:bold;
        text-shadow:2px 2px 4px rgba(0,0,0,.4);
    }

    #gameOver{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        text-align:center;
        color:white;
        display:none;
    }

    #gameOver h1{
        font-size:50px;
        margin-bottom:15px;
    }

    #gameOver button{
        padding:12px 25px;
        border:none;
        border-radius:10px;
        font-size:18px;
        cursor:pointer;
        background:#ffcc00;
        font-weight:bold;
    }
</style>
</head>
<body>

<div id="score">0</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <button onclick="restartGame()">REINICIAR</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const scoreText = document.getElementById("score");
const gameOverScreen = document.getElementById("gameOver");

let gravity = 0.5;
let gameSpeed = 3;
let score = 0;
let gameRunning = true;

const plane = {
    x:120,
    y:200,
    width:70,
    height:40,
    velocity:0,
    jump: -9
};

let pipes = [];

function createPipe(){
    const gap = 220;
    const topHeight = Math.random() * (canvas.height - 400) + 50;

    pipes.push({
        x: canvas.width,
        width: 90,
        top: topHeight,
        bottom: canvas.height - topHeight - gap,
        passed:false
    });
}

setInterval(() => {
    if(gameRunning){
        createPipe();
    }
}, 1800);

function drawPlane(){
    ctx.save();

    ctx.translate(plane.x, plane.y);

    // corpo
    ctx.fillStyle = "#ff3b30";
    ctx.fillRect(0, 0, plane.width, plane.height);

    // asa
    ctx.fillStyle = "#c62828";
    ctx.beginPath();
    ctx.moveTo(15, 20);
    ctx.lineTo(35, 50);
    ctx.lineTo(50, 20);
    ctx.fill();

    // nariz
    ctx.fillStyle = "#ffd54f";
    ctx.beginPath();
    ctx.moveTo(plane.width, 20);
    ctx.lineTo(plane.width + 15, 10);
    ctx.lineTo(plane.width + 15, 30);
    ctx.fill();

    // janela
    ctx.fillStyle = "#90caf9";
    ctx.beginPath();
    ctx.arc(20, 12, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawPipes(){
    ctx.fillStyle = "#2ecc71";

    pipes.forEach(pipe => {

        // cano superior
        ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);

        // cano inferior
        ctx.fillRect(
            pipe.x,
            canvas.height - pipe.bottom,
            pipe.width,
            pipe.bottom
        );
    });
}

function updatePipes(){
    pipes.forEach(pipe => {
        pipe.x -= gameSpeed;

        // pontuação
        if(!pipe.passed && pipe.x + pipe.width < plane.x){
            pipe.passed = true;
            score++;
            scoreText.innerText = score;
        }

        // colisão
        if(
            plane.x + plane.width > pipe.x &&
            plane.x < pipe.x + pipe.width &&
            (
                plane.y < pipe.top ||
                plane.y + plane.height > canvas.height - pipe.bottom
            )
        ){
            endGame();
        }
    });

    pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);
}

function drawGround(){
    ctx.fillStyle = "#c2b280";
    ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
}

function updatePlane(){
    plane.velocity += gravity;
    plane.y += plane.velocity;

    if(plane.y < 0){
        plane.y = 0;
        plane.velocity = 0;
    }

    if(plane.y + plane.height > canvas.height - 60){
        endGame();
    }
}

function endGame(){
    gameRunning = false;
    gameOverScreen.style.display = "block";
}

function restartGame(){
    plane.y = 200;
    plane.velocity = 0;

    pipes = [];
    score = 0;

    scoreText.innerText = "0";

    gameRunning = true;
    gameOverScreen.style.display = "none";
}

function gameLoop(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawGround();

    if(gameRunning){
        updatePlane();
        updatePipes();
    }

    drawPipes();
    drawPlane();

    requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", () => {
    if(gameRunning){
        plane.velocity = plane.jump;
    }
});

document.addEventListener("touchstart", () => {
    if(gameRunning){
        plane.velocity = plane.jump;
    }
});

gameLoop();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
